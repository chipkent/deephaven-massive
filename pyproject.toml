[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deephaven-massive"
version = "0.1.0"
description = "Live and static Deephaven tables for Massive.com (formerly Polygon.io) market data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chip Kent", email = "chipkent@illumon.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "deephaven-core>=42.0",
    # 16 is the first release that works with deephaven-core 42.0: 15 lacks pa.ListViewType,
    # which deephaven-core needs, and 14 fails to import against numpy 2.
    "pyarrow>=16",
    "boto3>=1.28.63",  # the boto3 release paired with the botocore floor below
    # 1.31.63 is the first release that works with urllib3 2 without a warning: 1.31.62 accepts
    # urllib3 2 but still passes its pools the `strict` argument, which urllib3 2.0 deprecates
    # with a DeprecationWarning on every new connection pool. Config(proxies=...),
    # proxies_config, and retries={"total_max_attempts": ..., "mode": ...} are older.
    "botocore>=1.31.63",
    # 2.0 is the first release with inline type information; ProxyManager is older.
    "urllib3>=2.0",
    # 2022.6.15.1 is the first release that finds its bundle with importlib.resources.files;
    # earlier releases call the deprecated importlib.resources.path. It has inline type
    # information (py.typed), which 2022.5.18 introduced.
    "certifi>=2022.6.15.1",
    # 17.1 is the first release that defines process_exception, the public rule for which
    # connection failures to retry, in websockets.client (17.0 and earlier define it only in
    # websockets.asyncio.client, which does not export it). Proxy support from the environment
    # (15.0) and cp314t wheels are older.
    "websockets>=17.1",
]

[project.optional-dependencies]
orjson = [
    # 3.9.15 is the first release that rejects JSON nested deeper than 1,024 levels; the codec
    # relies on that limit to keep deep or hostile bodies from exhausting the C stack.
    "orjson>=3.9.15",
]

[project.urls]
Homepage = "https://github.com/chipkent/deephaven-massive"
Repository = "https://github.com/chipkent/deephaven-massive"
Issues = "https://github.com/chipkent/deephaven-massive/issues"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=2.4",
    "types-boto3[s3]>=1.43",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "pyright>=1.1.414",
    "pre-commit>=4.7",
    "deephaven-server>=42.0",
]

[tool.hatch.build.targets.sdist]
# The sdist carries the package and its tests; hatchling adds README.md, LICENSE, and
# pyproject.toml itself. It also carries the generated column reference, docs/datasets/,
# which the tests compare byte for byte with what the package renders. It leaves out vendor/:
# the snapshot there is Massive's published content, kept only as input to the refresh, and
# the tests that read it skip without it.
only-include = ["src", "tests", "docs/datasets"]

[tool.hatch.build.targets.wheel]
packages = ["src/deephaven_massive"]
# The refresh runs from a source checkout only, reading the snapshot under vendor/; the wheel
# ships the generated spec/*.json as package data.
exclude = ["src/deephaven_massive/_massive/refresh"]

# ---------------------------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
# First-party import roots, the same as mypy's and pytest's: `deephaven_massive` from `src/`,
# `tests.…` from the repository root. `tests/` is not a root, so `tests/massive/` is never a
# top-level `massive`.
src = ["src", "."]
# tests/ has no __init__.py; its modules are imported from the repository root as `tests.…`.
# scripts/ has none either: its Python files are standalone scripts, run by path.
namespace-packages = ["tests", "scripts"]

[tool.ruff.lint]
# Besides ALL: the preview rules selected by name. DOC201, DOC501, and DOC502 check that
# docstring Returns and Raises sections match the code; PLR0904, PLR0914, and PLR0916 are the
# pylint limits on public methods, local variables, and boolean expressions.
select = ["ALL", "DOC201", "DOC501", "DOC502", "PLR0904", "PLR0914", "PLR0916"]
# Preview is on so the preview rules above can be selected by name; explicit-preview-rules keeps
# every other preview rule off. Preview also switches some stable rules (F401, UP007, the S3xx
# family, ...) to their preview behavior.
preview = true
explicit-preview-rules = true
ignore = [
    "COM812",  # conflicts with `ruff format`, which manages trailing commas
    # Project policy.
    "TRY003",  # exception messages carry context inline; no exception subclass per message
    "EM101",  # raising with a literal message is clearer than binding it to a variable first
    "EM102",  # raising with an f-string message is clearer than binding it to a variable first
    "PLR0913",  # keyword-only parameters are the API style; PLR0917 caps positional ones at 3
    "CPY001",  # the license is declared once in LICENSE and pyproject.toml, not per file
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest uses bare assert statements
    "PLR2004",  # literal expected values in assertions are the point of a test
    "SLF001",  # white-box tests may inspect private members
    "ARG001",  # pytest fixtures are requested by parameter name even when unused
    "ARG002",  # fake methods keep the signature of the interface they replace
    "FBT001",  # listener stand-ins keep Deephaven's on_update(update, is_replay) signature
    "D100",  # test docstrings are optional (any that exist must be well formed)
    "D101",  # test docstrings are optional (any that exist must be well formed)
    "D102",  # test docstrings are optional (any that exist must be well formed)
    "D103",  # test docstrings are optional (any that exist must be well formed)
    "D107",  # test docstrings are optional (any that exist must be well formed)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Fixtures are the only interface tests/conftest.py offers to test modules. The repository root
# is on sys.path, so its importable name is `tests.conftest`; `conftest` covers a stray rootdir.
"conftest".msg = "Request fixtures by name; never import conftest"
"tests.conftest".msg = "Request fixtures by name; never import conftest"
# The library has its own REST, WebSocket, and flat-file clients; Massive's Python SDK is not a
# dependency.
"massive".msg = "The library has its own clients; see deephaven_massive._massive"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-positional-args = 3

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
    "deprecated",
    "explicit-override",
]
# With explicit package bases, a file is named from the search root that contains it: modules
# under `src/` from `src/` (`deephaven_massive._session`), test modules from the working
# directory, the repository root (`tests.namespaces.test_init`). So `tests/test_init.py` and
# `tests/namespaces/test_init.py` never collide, and since `tests/` is not a search root,
# `import massive` never resolves to `tests/massive/`.
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------------------------
# Pyright (non-gating second checker)
# ---------------------------------------------------------------------------------------------

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

# ---------------------------------------------------------------------------------------------
# Pytest and coverage
# ---------------------------------------------------------------------------------------------

[tool.pytest]
strict = true
filterwarnings = ["error"]
# `-m "not integration"` keeps the live tests out of every default run, CI's included; a later
# `-m integration` on the command line replaces it, so `uv run pytest -m integration` runs only
# them (each also skips itself without `MASSIVE_API_KEY`).
addopts = ["-ra", "--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: a live test against Massive (tests/**/test_*_integration.py); deselected by default, run with -m integration and MASSIVE_API_KEY set",
    "integration_limits: deliberately exceeds Massive's subscription and connection limits; also marked integration, and run only with -m integration_limits",
    "integration_smoke: calls every dataset and verb once and checks its columns, unattended; also marked integration, and run only with -m integration_smoke",
    "needs(*plans): the plans a live test needs, each <class>:<plan>, s3, or some:basic; it skips unless MASSIVE_LIVE_PLANS declares them",
    "settles(*items): the open verification items a live test settles, for the run's summary",
    "requests(count): the REST requests a live test makes, which scale its timeout when its class is on Basic",
    "jvm_held: a test whose own formula hands its frame's locals to the JVM; its leak check asks the JVM to collect once",
]
testpaths = ["tests"]
# Puts the repository root on sys.path, which --import-mode=importlib does not do itself, so
# test code imports helpers as `tests._fakes…` (`tests` is an implicit namespace package, as
# are the other top-level directories). `tests/` itself is not on sys.path, so `import massive`
# never resolves to `tests/massive/`.
pythonpath = ["."]
timeout = "60"  # pytest-timeout declares this option as a string, so TOML needs one
faulthandler_timeout = "120"  # pytest declares this option as a string, so TOML needs one
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["deephaven_massive"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",  # imports for type checkers only; never executed
    "@(typing\\.)?overload",  # overload stubs are signatures for type checkers; they never run
]
