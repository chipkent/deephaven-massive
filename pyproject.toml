[build-system]
# hatch-vcs gives hatchling the version from the git tags (see [tool.hatch.version]). 0.5.0,
# its newest release, is the first to declare support for Python 3.13 and requires
# setuptools-scm 8.2 or later, which does the reading.
requires = ["hatchling>=1.27", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "deephaven-massive"
# The version comes from git (see [tool.hatch.version]); no file holds it.
dynamic = ["version"]
description = "Live and static Deephaven tables for Massive.com (formerly Polygon.io) market data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chip Kent", email = "chipkent@illumon.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "deephaven-core>=42.0",
    # 23.0.1 is the first release that fixes a use-after-free when reading an Arrow IPC file
    # (GHSA-rgxp-2hwp-jwgg); the library never reads IPC files itself. deephaven-core puts
    # no bound on pyarrow. pa.ListViewType, which deephaven-core needs, and numpy 2 support
    # are older.
    "pyarrow>=23.0.1",
    # The library imports numpy itself, for numpy.datetime64 date arguments, so it declares it
    # rather than reach it only through deephaven-core, which puts no bound on it. 1.23.2 is
    # the first release with wheels for Python 3.11, the oldest Python the library supports;
    # the whole suite passes on it with pyarrow and deephaven-core at their floors.
    # numpy.datetime64, numpy.isnat, and numpy.datetime_data are much older.
    "numpy>=1.23.2",
    "boto3>=1.34.63",  # the boto3 release paired with the botocore floor below
    # 1.34.63 is the first release that accepts urllib3 2.1 or later (on Python 3.10 and up);
    # 1.34.62 caps urllib3 below 2.1, which would hold urllib3 under its own floor below.
    # Config(proxies=...), proxies_config, and retries={"total_max_attempts": ..., "mode": ...}
    # are older.
    "botocore>=1.34.63",
    # 2.8.0 is the first release that fixes all of these advisories. It strips headers and
    # bodies from cross-origin and 303 redirects (GHSA-g4mx-q9vg-27p4, GHSA-34jh-p97f-mpxf,
    # GHSA-qccp-gfcp-xxvc; the REST client never follows a redirect, but botocore's S3
    # requests do), honors redirects disabled when a PoolManager is created
    # (GHSA-pq67-6m6q-mj2v), limits chained Content-Encoding (GHSA-gm62-xv2j-4w53), bounds
    # decompression and chunk sizes in the streaming API that botocore reads S3 objects
    # through (GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99, GHSA-mf9v-mfxr-j63j,
    # GHSA-vxq7-64xx-v4gw), and keeps an HTTPS proxy's TLS settings apart from the target's
    # (GHSA-8988-9cw3-xx77). Inline type information and ProxyManager are older.
    "urllib3>=2.8.0",
    # 2026.10.19 is the release that advisory GHSA-6q48-6c7w-9gw2 recommends. It no longer
    # trusts emSign ECC Root CA - G3, under which the private keys of eight intermediate CAs
    # were compromised: with one of them, an on-path attacker could forge a certificate for
    # any host. Earlier releases also trust the withdrawn TrustCor, e-Tugra and GLOBALTRUST
    # roots. Finding the bundle with importlib.resources.files and inline type information
    # (py.typed) are older.
    "certifi>=2026.10.19",
    # 17.1 is the first release that defines process_exception, the public rule for which
    # connection failures to retry, in websockets.client (17.0 and earlier define it only in
    # websockets.asyncio.client, which does not export it). Proxy support from the environment
    # (15.0) and cp314t wheels are older.
    "websockets>=17.1",
    # The library reads its settings file, which is YAML, with a loader built on PyYAML's
    # BaseLoader, so every value is read as plain text and no value's type is guessed (ON stays
    # the text "ON"); the library converts each setting itself. 6.0.3 is the first release with
    # wheels for Python 3.14 and its free-threaded build, and it declares itself safe to run
    # without the GIL, so importing it leaves the GIL off on 3.14t. BaseLoader and the YAMLError
    # exceptions are much older.
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
orjson = [
    # 3.11.6 is the first release that limits recursion in orjson.dumps for deeply nested
    # objects (GHSA-hx9q-6w63-j58v); the codec only decodes, so the fix does not reach it.
    # Rejecting JSON nested deeper than 1,024 levels while decoding, which the codec relies on
    # to keep deep or hostile bodies from exhausting the C stack, is older.
    "orjson>=3.11.6",
]

[project.urls]
Homepage = "https://github.com/chipkent/deephaven-massive"
Repository = "https://github.com/chipkent/deephaven-massive"
Issues = "https://github.com/chipkent/deephaven-massive/issues"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=2.4",
    "types-boto3[s3]>=1.43",
    # The stubs released when PyYAML 6.0.3 came out; mypy checks the settings file reader with
    # them.
    "types-PyYAML>=6.0.12.20250915",
    # 9.0.3 is the first release that stops trusting a /tmp/pytest-of-{user} directory another
    # local user could have created first (GHSA-6w46-j5rx-g56g).
    "pytest>=9.0.3",
    "pytest-cov>=7",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "pyright>=1.1.414",
    "pre-commit>=4.7",
    "deephaven-server>=42.0",
]

[tool.hatch.version]
# The git tag is the one source of the version: a build of a commit tagged v0.1.0rc1 is version
# 0.1.0rc1, and a build of any other commit gets a development version past the latest tag,
# such as 0.1.0rc2.dev5+g1a2b3c4 for the fifth commit after v0.1.0rc1, or 0.1.dev215+g1a2b3c4
# before the first tag. hatch-vcs reads it through setuptools-scm, which needs the history and
# the tags (a CI checkout with fetch-depth: 0), or the .git_archival.txt that `git archive`
# fills in. The sdist records the version, so a build from the sdist needs no git.
source = "vcs"

[tool.uv]
# uv rebuilds the project's own install in .venv when one of these changes. With the version
# taken from git, that includes a new commit or tag, so deephaven_massive.__version__ in .venv
# stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.sdist]
# The sdist carries the package and its tests; hatchling adds README.md, LICENSE, and
# pyproject.toml itself. It also carries the generated column reference, docs/datasets/,
# which the tests compare byte for byte with what the package renders. It leaves out vendor/:
# the snapshot there is Massive's published content, kept only as input to the refresh, and
# the tests that read it skip without it.
only-include = ["src", "tests", "docs/datasets"]

[tool.hatch.build.targets.wheel]
packages = ["src/deephaven_massive"]
# The refresh runs from a source checkout only, reading the snapshot under vendor/; the wheel
# ships the generated spec/*.json as package data.
exclude = ["src/deephaven_massive/_massive/refresh"]

# ---------------------------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
# First-party import roots, the same as mypy's and pytest's: `deephaven_massive` from `src/`,
# `tests.…` from the repository root. `tests/` is not a root, so `tests/massive/` is never a
# top-level `massive`.
src = ["src", "."]
# tests/ has no __init__.py; its modules are imported from the repository root as `tests.…`.
# scripts/ has none either: its Python files are standalone scripts, run by path.
namespace-packages = ["tests", "scripts"]

[tool.ruff.lint]
# Besides ALL: the preview rules selected by name. DOC201 and DOC501 check that docstring
# Returns and Raises sections cover the code; PLR0904, PLR0914, and PLR0916 are the
# pylint limits on public methods, local variables, and boolean expressions.
select = ["ALL", "DOC201", "DOC501", "PLR0904", "PLR0914", "PLR0916"]
# Preview is on so the preview rules above can be selected by name; explicit-preview-rules keeps
# every other preview rule off. Preview also switches some stable rules (F401, UP007, the S3xx
# family, ...) to their preview behavior.
preview = true
explicit-preview-rules = true
ignore = [
    "COM812",  # conflicts with `ruff format`, which manages trailing commas
    # Project policy.
    "TRY003",  # exception messages carry context inline; no exception subclass per message
    "EM101",  # raising with a literal message is clearer than binding it to a variable first
    "EM102",  # raising with an f-string message is clearer than binding it to a variable first
    "PLR0913",  # keyword-only parameters are the API style; PLR0917 caps positional ones at 3
    "CPY001",  # the license is declared once in LICENSE and pyproject.toml, not per file
    # Many functions raise through helpers, and tests/test_errors.py checks the public API's
    # Raises sections in both directions; DOC501 still catches an undocumented raise.
    "DOC502",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest uses bare assert statements
    "PLR2004",  # literal expected values in assertions are the point of a test
    "SLF001",  # white-box tests may inspect private members
    "ARG001",  # pytest fixtures are requested by parameter name even when unused
    "ARG002",  # fake methods keep the signature of the interface they replace
    "FBT001",  # listener stand-ins keep Deephaven's on_update(update, is_replay) signature
    "D100",  # test docstrings are optional (any that exist must be well formed)
    "D101",  # test docstrings are optional (any that exist must be well formed)
    "D102",  # test docstrings are optional (any that exist must be well formed)
    "D103",  # test docstrings are optional (any that exist must be well formed)
    "D107",  # test docstrings are optional (any that exist must be well formed)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Fixtures are the only interface tests/conftest.py offers to test modules. The repository root
# is on sys.path, so its importable name is `tests.conftest`; `conftest` covers a stray rootdir.
"conftest".msg = "Request fixtures by name; never import conftest"
"tests.conftest".msg = "Request fixtures by name; never import conftest"
# The library has its own REST, WebSocket, and flat-file clients; Massive's Python SDK is not a
# dependency.
"massive".msg = "The library has its own clients; see deephaven_massive._massive"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-positional-args = 3
# A namespace class has one public factory method per dataset, so its size is the API's: the
# stocks namespace holds 21, its two nested namespaces included. The limit still catches any
# other class that grows past it.
max-public-methods = 24

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
    "deprecated",
    "explicit-override",
]
# With explicit package bases, a file is named from the search root that contains it: modules
# under `src/` from `src/` (`deephaven_massive._session`), test modules from the working
# directory, the repository root (`tests.namespaces.test_init`). So `tests/test_init.py` and
# `tests/namespaces/test_init.py` never collide, and since `tests/` is not a search root,
# `import massive` never resolves to `tests/massive/`.
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------------------------
# Pyright (non-gating second checker)
# ---------------------------------------------------------------------------------------------

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

# ---------------------------------------------------------------------------------------------
# Pytest and coverage
# ---------------------------------------------------------------------------------------------

[tool.pytest]
strict = true
filterwarnings = ["error"]
# The options every pytest run starts with, CI's included. `-ra` lists each skipped or failed
# test at the end of the run. `--import-mode=importlib` imports test files without adding their
# directories to sys.path. `-m` picks which tests run: it leaves out the live tests, which call
# Massive's real servers, the benchmark sweep, which only prints timings, and the soak tests,
# which run for minutes or hours. Pass your own `-m` to replace it: `uv run pytest -m
# integration` runs only the live tests (each skips itself unless MASSIVE_API_KEY is set),
# `uv run pytest -m benchmark` runs only the sweep, and `uv run pytest -m soak` runs only the
# soak tests (docs/dev/soak-tests.md).
addopts = [
    "-ra",
    "--import-mode=importlib",
    "-m",
    "not integration and not benchmark and not soak",
]
# Each entry is `name(arguments): what the marker means`, shown by `uv run pytest --markers`.
markers = [
    "integration: a live test, one that calls Massive's real servers. Every test in a file named test_*_integration.py has this marker, and no other test does. A plain run leaves these tests out; run them with -m integration and MASSIVE_API_KEY set.",
    "integration_limits: a live test that deliberately goes over the number of subscriptions or connections Massive allows. It also has the integration marker, but -m integration leaves it out; run it with -m integration_limits.",
    "integration_smoke: a live test that calls every dataset with every kind of query once and checks the columns that come back, so it can run unattended. It also has the integration marker, but -m integration leaves it out; run it with -m integration_smoke.",
    "integration_rate_limits: a live test that sends a class on the free Basic plan more than its 5 REST requests a minute on purpose, to record how Massive refuses them and how the library learns the limit. It needs at least one asset class left on Basic and no other client of the key, and it waits out whole minutes. It also has the integration marker, but -m integration leaves it out; run it with -m integration_rate_limits.",
    "needs(*plans): the Massive plans a live test requires. Write each plan as <asset class>:<plan>, such as stocks:starter; as s3, for the flat-file credentials; or as some:basic, for at least one asset class left on the free Basic plan. The test is skipped unless the key holds them: the first live test of a run asks Massive which plans the key holds, unless MASSIVE_LIVE_PLANS declares them.",
    "settles(*items): the open questions a live test records evidence for, which a person reads. The summary at the end of the run lists them as ran once every test of them passed.",
    "verifies(*items): the open questions whose answer a live test asserts: it fails unless Massive still behaves as the library assumes. The summary at the end of the run lists them as verified once every test of them passed.",
    "requests(count): the most REST requests a live test sends to one asset class when that class is on the free Basic plan, which allows 5 requests a minute. A test that may read a class on Basic declares at most 5, reading fewer symbols or pages there than on a paid plan, so it never waits more than about a minute; a unit test enforces this, and a live run skips a test that declares more while its class is on Basic. Its time limit grows with this count. A test without the marker counts as 10.",
    "jvm_held: a test whose own Deephaven formula passes the test's local variables to the JVM. Before the leak check fails the test, it asks the JVM to free unused memory once.",
    "benchmark: one point of a benchmark sweep, a test that prints timings and never fails on them. A plain run leaves these tests out; run them with -m benchmark.",
    "soak: a long stress test that drives the library against the fake servers under heavy load (a fast feed, many streams, and constant churn) for MASSIVE_SOAK_SECONDS seconds, 20 by default. It fails on a lost or repeated row, a hang, or memory or threads that keep growing. A plain run leaves these tests out; run them with -m soak, as docs/dev/soak-tests.md describes.",
]
testpaths = ["tests"]
# Puts the repository root on sys.path, which --import-mode=importlib does not do itself, so
# test code imports helpers as `tests._fakes…` (`tests` is an implicit namespace package, as
# are the other top-level directories). `tests/` itself is not on sys.path, so `import massive`
# never resolves to `tests/massive/`.
pythonpath = ["."]
timeout = "60"  # pytest-timeout declares this option as a string, so TOML needs one
faulthandler_timeout = "120"  # pytest declares this option as a string, so TOML needs one
faulthandler_exit_on_timeout = true

[tool.coverage.run]
# The library, and the logic of the live tests' fixtures, which runs only against Massive in a
# live run and so is unit-tested against the fakes (`tests/live/`).
source = ["deephaven_massive", "tests/_live"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",  # imports for type checkers only; never executed
    "@(typing\\.)?overload",  # overload stubs are signatures for type checkers; they never run
]
