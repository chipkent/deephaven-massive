[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deephaven-massive"
version = "0.1.0"
description = "Deephaven tables integration for Massive.com (formerly Polygon.io) real-time, historical, fundamental, macro, and flat-file market data feeds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Deephaven Massive Contributors" }
]
dependencies = [
    "massive>=1.0.0",
    "deephaven-core>=0.36.0",
    "deephaven-server>=0.36.0",
    "pyarrow>=14.0.0",
    "boto3>=1.28.0",
    "websockets>=11.0.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deephaven_massive"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=deephaven_massive --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src/deephaven_massive"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
