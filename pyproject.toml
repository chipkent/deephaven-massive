[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deephaven-massive"
version = "0.1.0"
description = "Live and static Deephaven tables for Massive.com (formerly Polygon.io) market data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chip Kent", email = "chipkent@illumon.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "massive>=2.9.0",
    "deephaven-core>=42.0",
    # 16 is the first release that works with deephaven-core 42.0: 15 lacks pa.ListViewType,
    # which deephaven-core needs, and 14 fails to import against numpy 2.
    "pyarrow>=16",
    "boto3>=1.28.62",  # the boto3 release paired with the botocore floor below
    # 1.31.62 is the first release that accepts urllib3 2; Config(proxies=...) and
    # retries={"total_max_attempts": ...} are older.
    "botocore>=1.31.62",
    # 2.0 is the first release with inline type information; ProxyManager is older.
    "urllib3>=2.0",
    # 2022.5.18 is the first release with inline type information (py.typed).
    "certifi>=2022.5.18",
    # 15.0 is the first release whose asyncio connect() reads proxies from the environment.
    "websockets>=15.0",
]

[project.optional-dependencies]
orjson = ["orjson>=3.9"]

[project.urls]
Homepage = "https://github.com/chipkent/deephaven-massive"
Repository = "https://github.com/chipkent/deephaven-massive"
Issues = "https://github.com/chipkent/deephaven-massive/issues"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=2.4",
    "types-boto3[s3]>=1.43",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-timeout>=2.4",
    "pyright>=1.1.414",
    "pre-commit>=4.7",
    "deephaven-server>=42.0",
]

[tool.uv.sources]
# The fork's `deephaven-fixes` integration branch. uv.lock is not committed: CI resolves the
# branch head on every run and scripts/check.sh refreshes it locally (uv sync --upgrade); a
# plain `uv sync` keeps the local lock. With a source set, uv takes this git source and ignores
# the `massive>=2.9.0` specifier, which matters only in published metadata. The fork builds as
# version 0.0.0, so no code or test may check the massive version.
massive = { git = "https://github.com/chipkent/massive-client-python", branch = "deephaven-fixes" }

[tool.hatch.build.targets.sdist]
# The sdist carries the package and its tests; hatchling adds README.md, LICENSE, and
# pyproject.toml itself.
only-include = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/deephaven_massive"]

# ---------------------------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
# First-party import roots, the same as mypy's and pytest's: `deephaven_massive` from `src/`,
# `tests.…` from the repository root. `tests/` is not a root, so `massive` stays third-party.
src = ["src", "."]
# tests/ has no __init__.py; its modules are imported from the repository root as `tests.…`.
namespace-packages = ["tests"]

[tool.ruff.lint]
# Besides ALL: the preview rules selected by name. DOC201, DOC501, and DOC502 check that
# docstring Returns and Raises sections match the code; PLR0904, PLR0914, and PLR0916 are the
# pylint limits on public methods, local variables, and boolean expressions.
select = ["ALL", "DOC201", "DOC501", "DOC502", "PLR0904", "PLR0914", "PLR0916"]
# Preview is on so the preview rules above can be selected by name; explicit-preview-rules keeps
# every other preview rule off. Preview also switches some stable rules (F401, UP007, the S3xx
# family, ...) to their preview behavior.
preview = true
explicit-preview-rules = true
ignore = [
    "COM812",  # conflicts with `ruff format`, which manages trailing commas
    # Project policy.
    "TRY003",  # exception messages carry context inline; no exception subclass per message
    "EM101",  # raising with a literal message is clearer than binding it to a variable first
    "EM102",  # raising with an f-string message is clearer than binding it to a variable first
    "PLR0913",  # keyword-only parameters are the API style; PLR0917 caps positional ones at 3
    "CPY001",  # the license is declared once in LICENSE and pyproject.toml, not per file
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest uses bare assert statements
    "PLR2004",  # literal expected values in assertions are the point of a test
    "SLF001",  # white-box tests may inspect private members
    "ARG001",  # pytest fixtures are requested by parameter name even when unused
    "ARG002",  # fake methods keep the signature of the interface they replace
    "FBT001",  # listener stand-ins keep Deephaven's on_update(update, is_replay) signature
    "D100",  # test docstrings are optional (any that exist must be well formed)
    "D101",  # test docstrings are optional (any that exist must be well formed)
    "D102",  # test docstrings are optional (any that exist must be well formed)
    "D103",  # test docstrings are optional (any that exist must be well formed)
    "D107",  # test docstrings are optional (any that exist must be well formed)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Fixtures are the only interface tests/conftest.py offers to test modules. The repository root
# is on sys.path, so its importable name is `tests.conftest`; `conftest` covers a stray rootdir.
"conftest".msg = "Request fixtures by name; never import conftest"
"tests.conftest".msg = "Request fixtures by name; never import conftest"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-positional-args = 3

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
    "deprecated",
    "explicit-override",
]
# With explicit package bases, a file is named from the search root that contains it: modules
# under `src/` from `src/` (`deephaven_massive._session`), test modules from the working
# directory, the repository root (`tests.namespaces.test_init`). So `tests/test_init.py` and
# `tests/namespaces/test_init.py` never collide, and since `tests/` is not a search root,
# `import massive` never resolves to `tests/massive/`.
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------------------------
# Pyright (non-gating second checker)
# ---------------------------------------------------------------------------------------------

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

# ---------------------------------------------------------------------------------------------
# Pytest and coverage
# ---------------------------------------------------------------------------------------------

[tool.pytest]
strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--import-mode=importlib"]
testpaths = ["tests"]
# Puts the repository root on sys.path, which --import-mode=importlib does not do itself, so
# test code imports helpers as `tests._fakes…` (`tests` is an implicit namespace package, as
# are the other top-level directories). `tests/` itself is not on sys.path, so `import massive`
# never resolves to `tests/massive/`.
pythonpath = ["."]
timeout = "60"  # pytest-timeout declares this option as a string, so TOML needs one
faulthandler_timeout = "120"  # pytest declares this option as a string, so TOML needs one
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["deephaven_massive"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",  # imports for type checkers only; never executed
    "@(typing\\.)?overload",  # overload stubs are signatures for type checkers; they never run
]
