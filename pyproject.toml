[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deephaven-massive"
version = "0.1.0"
description = "Deephaven tables integration for Massive.com (formerly Polygon.io) real-time, historical, fundamental, macro, and flat-file market data feeds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Deephaven Massive Contributors" }
]
dependencies = [
    "massive>=1.0.0",
    "deephaven-core>=0.36.0",
    "deephaven-server>=0.36.0",
    "pyarrow>=14.0.0",
    "boto3>=1.28.0",
    "websockets>=11.0.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deephaven_massive"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort import sorting
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "FURB",  # refurb
    "PIE",   # flake8-pie
    "RUF",   # Ruff-specific rules
    "D",     # pydocstyle (Google convention)
]
ignore = [
    "E501",  # line length handled by ruff format
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "deephaven.*",
    "pyarrow.*",
    "boto3.*",
    "botocore.*",
    "massive.*",
    "websockets.*",
    "urllib3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=deephaven_massive --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src/deephaven_massive"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
