name: CI

# A pull request runs only the jobs its changes can affect; a push to main runs every job. The
# lint job decides which, from the pull request's files, and the ci-ok job, the single required
# check, passes only when every job the change selected passed and every other job was skipped.
# Requiring the jobs themselves would not work: a skipped matrix job reports no status under
# its entries' names, so a pull request that skips the tests would wait forever.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per pull request (and one for main): a new push cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # This job also decides which jobs the change affects, so every other job waits for it, and
    # none starts when it fails. GitHub bills each job by the whole minute, so a job of its own
    # for a decision that takes seconds would add a minute to every run; this job's runner
    # starts on every run anyway, and skips its own checks when the change cannot affect them.
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The repository is private, so listing a pull request's files needs this scope.
      pull-requests: read
    outputs:
      lint: ${{ steps.decide.outputs.lint }}
      test: ${{ steps.decide.outputs.test }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: List the files the pull request changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        # One line per changed file: its path, a tab, and its old path when it was renamed, so a
        # file moved out of src/ still counts as a change to src/.
        run: >-
          gh api --paginate "$FILES_URL?per_page=100"
          --jq '.[] | .filename + "\t" + (.previous_filename // "")'
          > "$RUNNER_TEMP/changed-files.tsv"
      - name: Decide which jobs the change affects
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        # Each job's pattern matches every path the job reads, so a change anywhere else cannot
        # change its result. A test that starts reading a file outside its pattern must add the
        # file there.
        run: |
          set -euo pipefail
          everything() {
            echo "Every job runs: $1."
            printf '%s=true\n' lint test build >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" != pull_request ]; then
            everything "a $EVENT event runs every job"
            exit 0
          fi
          listed=$(wc -l < "$RUNNER_TEMP/changed-files.tsv")
          if [ "$listed" -ne "$CHANGED_FILES" ]; then
            # GitHub lists at most 3,000 of a pull request's files, and a push can land between
            # the event and the listing.
            everything "GitHub listed $listed of the $CHANGED_FILES changed files"
            exit 0
          fi
          paths=$(tr '\t' '\n' < "$RUNNER_TEMP/changed-files.tsv" | sed '/^$/d')
          if grep -qE '^\.github/workflows/' <<< "$paths"; then
            everything "a workflow changed, and every job must exercise a workflow change"
            exit 0
          fi
          decide() {
            if grep -qE "$2" <<< "$paths"; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            # Ruff and mypy check src/, tests/, and scripts/, configured by pyproject.toml.
            decide lint '^(src|tests|scripts)/|^pyproject\.toml$'
            # The suite also reads the vendored snapshot under vendor/ and the committed column
            # reference under docs/datasets/, whose line endings .gitattributes fixes, and it
            # runs scripts/spec-drift-issue.sh.
            decide test '^(src|tests|scripts|vendor)/|^docs/datasets/|^(pyproject\.toml|\.gitattributes)$'
            # The sdist carries src/, tests/, and docs/datasets/; the package metadata takes
            # README.md and LICENSE; hatchling leaves out what .gitignore lists; and the wheel
            # check compares the installed wheel with docs/datasets/.
            decide build '^(src|tests)/|^docs/datasets/|^scripts/check_wheel\.py$|^(pyproject\.toml|README\.md|LICENSE|\.gitattributes|\.gitignore)$'
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.lint == 'true'
        with:
          persist-credentials: false
      - name: Install uv
        if: steps.decide.outputs.lint == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # No uv.lock is committed; key the cache on the declared dependencies.
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        if: steps.decide.outputs.lint == 'true'
        run: uv python install 3.11
      - name: Sync dependencies
        if: steps.decide.outputs.lint == 'true'
        # uv.lock is not committed, so this resolves the newest versions.
        run: uv sync --python 3.11
      - name: Ruff and mypy (scripts/check.sh fast --no-fix)
        if: steps.decide.outputs.lint == 'true'
        # GitHub sets CI=true, so ruff reports in GitHub annotation format.
        run: ./scripts/check.sh fast --no-fix
      - name: Pyright (non-gating)
        if: steps.decide.outputs.lint == 'true'
        continue-on-error: true
        run: uv run pyright src

  test:
    name: test (${{ matrix.python-version }})
    needs: lint
    if: needs.lint.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.14t is the only free-threaded target: pyarrow, numpy, and pandas no longer publish
        # cp313t wheels.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      # The free-threaded build runs with the GIL disabled; an empty value is ignored.
      PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17 (required by the embedded Deephaven server)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # No uv.lock is committed; key the cache on the declared dependencies.
          cache-dependency-glob: pyproject.toml
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        # uv.lock is not committed, so this resolves the newest versions. The orjson extra is
        # tested on 3.14; orjson publishes no free-threaded wheels.
        run: >-
          uv sync --python ${{ matrix.python-version }}
          ${{ matrix.python-version == '3.14' && '--extra orjson' || '' }}
      - name: Pytest with 100% statement and branch coverage
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
      - name: Upload JVM crash logs
        # tests/conftest.py points the JVM's crash log (-XX:ErrorFile) at the repository root.
        # A job cancelled by its timeout can be a hung or crashed JVM too.
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hs-err-py${{ matrix.python-version }}
          path: hs_err_pid*.log
          if-no-files-found: ignore

  test-lowest:
    # The other jobs resolve the newest versions, so a floor in pyproject.toml that is too low
    # never shows up there; a user whose environment pins an older version would find it. This
    # job installs every direct dependency at its declared floor and runs the suite.
    name: test (3.11, lowest direct)
    needs: lint
    if: needs.lint.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17 (required by the embedded Deephaven server)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # No uv.lock is committed; key the cache on the declared dependencies.
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.11
        # The floor of requires-python. Old releases publish no wheels for interpreters that
        # came after them, so the floors can only install on the oldest supported Python.
        run: uv python install 3.11
      - name: Sync dependencies at their floors
        # lowest-direct pins every direct dependency, the dev group and the orjson extra
        # included, to the lowest version its specifier allows; transitive dependencies
        # resolve to their newest compatible versions, as they would for a user.
        run: uv sync --python 3.11 --resolution lowest-direct --extra orjson
      - name: Show the resolved floor versions
        run: >-
          uv pip list | grep -iE
          '^(deephaven-core|deephaven-server|pyarrow|numpy|pandas|boto3|botocore|urllib3|certifi|websockets|orjson|pytest) '
      - name: Pytest
        # Coverage is the newest-versions jobs' gate; this job checks only that the floors work.
        run: uv run --no-sync pytest
      - name: Upload JVM crash logs
        # tests/conftest.py points the JVM's crash log (-XX:ErrorFile) at the repository root.
        # A job cancelled by its timeout can be a hung or crashed JVM too.
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hs-err-py3.11-lowest-direct
          path: hs_err_pid*.log
          if-no-files-found: ignore

  build:
    name: build
    needs: lint
    if: needs.lint.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # No uv.lock is committed; key the cache on the declared dependencies.
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        run: uv python install 3.11
      - name: Build wheel and sdist
        run: uv build --python 3.11
      - name: Check the distributions ship the wire schema and no refresh code or vendor files
        # The refresh runs from a source checkout only; the generated spec/*.json (the REST,
        # WebSocket, and flat-file schemas and the vendor's field descriptions) are package
        # data the library loads at run time.
        # The vendored snapshot under vendor/ is Massive's published content and goes in
        # neither distribution. The sdist carries the column reference its tests compare.
        run: |
          unzip -Z1 dist/*.whl > "$RUNNER_TEMP/wheel-files.txt"
          tar -tzf dist/*.tar.gz > "$RUNNER_TEMP/sdist-files.txt"
          for name in rest.json ws.json flatfiles.json descriptions.json; do
            grep -qx "deephaven_massive/_massive/spec/$name" "$RUNNER_TEMP/wheel-files.txt" \
              || { echo "the wheel lacks spec/$name" >&2; exit 1; }
          done
          if grep -q '^deephaven_massive/_massive/refresh/' "$RUNNER_TEMP/wheel-files.txt"; then
            echo "the wheel contains the refresh package:" >&2
            grep '^deephaven_massive/_massive/refresh/' "$RUNNER_TEMP/wheel-files.txt" >&2
            exit 1
          fi
          grep -q '^[^/]*/docs/datasets/stocks\.md$' "$RUNNER_TEMP/sdist-files.txt" \
            || { echo "the sdist lacks the column reference, docs/datasets/" >&2; exit 1; }
          if grep -q '^[^/]*/vendor/' "$RUNNER_TEMP/sdist-files.txt"; then
            echo "the sdist contains vendored files:" >&2
            grep '^[^/]*/vendor/' "$RUNNER_TEMP/sdist-files.txt" >&2
            exit 1
          fi
      - name: Set up JDK 17 (the wheel check starts an embedded Deephaven server)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Check the built wheel in a clean environment, inside a Deephaven server
        # The library imports deephaven at module level, so using it needs a running Deephaven
        # JVM, exactly as it does for users. The wheel is installed, with its dependencies from
        # PyPI, in a fresh virtual environment next to deephaven-server. The script starts a
        # server, imports every module the wheel ships, renders the column reference from the
        # installed catalog and compares it with docs/datasets/, and opens a session. -I keeps
        # PYTHONPATH and the script's directory off sys.path, and the script fails if the
        # package is imported from the checkout's src/ rather than the wheel.
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl deephaven-server
          "$RUNNER_TEMP/smoke/bin/python" -I scripts/check_wheel.py docs/datasets
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  ci-ok:
    # The single required check. It runs even when a job it needs failed or was cancelled, so
    # it always reports a status: a skipped required check would count as passed.
    name: ci-ok
    needs: [lint, test, test-lowest, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that each job passed, or was skipped because the change cannot affect it
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          TEST_LOWEST: ${{ needs.test-lowest.result }}
          BUILD: ${{ needs.build.result }}
          RUN_TEST: ${{ needs.lint.outputs.test }}
          RUN_BUILD: ${{ needs.lint.outputs.build }}
        # The lint job runs on every run, since it makes the decision, so it must pass; it
        # skips its own checks when the change cannot affect them. The other jobs wait for it,
        # so they never start after a lint failure. A matrix job's result is success only when
        # every entry passed, the free-threaded 3.14t entry included.
        run: |
          set -euo pipefail
          failed=0
          expect() {
            if [ "$3" = "$2" ]; then
              echo "$1: $3"
            else
              echo "::error::$1: $3, expected $2"
              failed=1
            fi
          }
          wanted() { if [ "$1" = true ]; then echo success; else echo skipped; fi; }
          expect lint success "$LINT"
          expect test "$(wanted "$RUN_TEST")" "$TEST"
          expect test-lowest "$(wanted "$RUN_TEST")" "$TEST_LOWEST"
          expect build "$(wanted "$RUN_BUILD")" "$BUILD"
          exit "$failed"
