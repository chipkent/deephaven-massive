name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock:
    name: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --locked --python 3.11
      - name: Ruff and mypy (scripts/check.sh fast --no-fix)
        # GitHub sets CI=true, so ruff reports in GitHub annotation format.
        run: ./scripts/check.sh fast --no-fix
      - name: Pyright (non-gating)
        continue-on-error: true
        run: uv run pyright src

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
    env:
      # Free-threaded builds (the "t" entries) run with the GIL disabled; the others ignore it.
      PYTHON_GIL: ${{ endsWith(matrix.python-version, 't') && '0' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17 (required by the embedded Deephaven server)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        # mypy's ast-serialize publishes no cp313t wheel and its sdist does not build on 3.13t.
        # The test job does not run mypy, so 3.13t skips installing it.
        run: >-
          uv sync --locked --python ${{ matrix.python-version }}
          ${{ matrix.python-version == '3.13t' && '--no-install-package ast-serialize' || '' }}
      - name: Pytest with 100% statement and branch coverage
        # --no-sync keeps uv run from reinstalling what the sync step deliberately skipped.
        run: uv run --no-sync pytest --cov --cov-report=xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build wheel and sdist
        run: uv build
      - name: Import the built wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl python -c "import deephaven_massive"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
