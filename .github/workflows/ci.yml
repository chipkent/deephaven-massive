name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # No uv.lock is committed; key the cache on the declared dependencies.
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        # uv.lock is not committed, so this resolves the newest versions, including the latest
        # deephaven-fixes commit of the SDK fork.
        run: uv sync --python 3.11
      - name: Ruff and mypy (scripts/check.sh fast --no-fix)
        # GitHub sets CI=true, so ruff reports in GitHub annotation format.
        run: ./scripts/check.sh fast --no-fix
      - name: Pyright (non-gating)
        continue-on-error: true
        run: uv run pyright src

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.14t is the only free-threaded target: pyarrow, numpy, and pandas no longer publish
        # cp313t wheels.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      # The free-threaded build runs with the GIL disabled; an empty value is ignored.
      PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17 (required by the embedded Deephaven server)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # No uv.lock is committed; key the cache on the declared dependencies.
          cache-dependency-glob: pyproject.toml
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        # uv.lock is not committed, so this resolves the newest versions, including the latest
        # deephaven-fixes commit of the SDK fork. The orjson extra is tested on 3.14; orjson
        # publishes no free-threaded wheels.
        run: >-
          uv sync --python ${{ matrix.python-version }}
          ${{ matrix.python-version == '3.14' && '--extra orjson' || '' }}
      - name: Show the installed massive commit (the deephaven-fixes head)
        run: >-
          uv run --no-sync python -c "import json, importlib.metadata as m;
          print(json.loads(m.distribution('massive').read_text('direct_url.json'))['vcs_info']['commit_id'])"
      - name: Pytest with 100% statement and branch coverage
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # No uv.lock is committed; key the cache on the declared dependencies.
          cache-dependency-glob: pyproject.toml
      - name: Set up Python
        run: uv python install 3.11
      - name: Build wheel and sdist
        run: uv build --python 3.11
      - name: Set up JDK 17 (the import smoke test starts an embedded Deephaven server)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Import the built wheel in a clean environment, inside a Deephaven server
        # The library imports deephaven at module level, so importing it needs a running
        # Deephaven JVM, exactly as it does for users. The wheel is installed in a fresh
        # virtual environment next to deephaven-server and the latest deephaven-fixes. The fork
        # builds as version 0.0.0, which cannot satisfy the wheel's massive>=2.9.0, so an
        # override supplies it. A server is started, and only then is the package imported.
        run: |
          echo "massive @ git+https://github.com/chipkent/massive-client-python@deephaven-fixes" > "$RUNNER_TEMP/overrides.txt"
          uv venv --python 3.11 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" \
            --override "$RUNNER_TEMP/overrides.txt" dist/*.whl deephaven-server
          "$RUNNER_TEMP/smoke/bin/python" -c "import json, importlib.metadata as m;
          print('massive', json.loads(m.distribution('massive').read_text('direct_url.json'))['vcs_info']['commit_id'])"
          "$RUNNER_TEMP/smoke/bin/python" -c "from deephaven_server import Server; Server(port=0).start();
          import deephaven_massive; print(deephaven_massive.__version__)"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
