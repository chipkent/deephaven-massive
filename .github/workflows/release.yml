name: Release

# Pushing a version tag, such as v0.1.0 or v0.1.0rc1, releases the commit it names. The tag is
# checked first: it must name a commit on main and equal the version in pyproject.toml. Then
# the whole CI workflow runs on that commit, every test job included, and builds the wheel and
# the sdist once. Only when all of it passes does the next job create the GitHub Release, with
# notes generated from the pull request titles since the previous release and both
# distributions attached. Publishing to PyPI is a separate last job that stays off until the
# repository variable PUBLISH_TO_PYPI is set to true. docs/dev/releasing.md explains how to cut
# a release and how to turn publishing on.

on:
  push:
    tags:
      - "v[0-9]*"

concurrency:
  # One run per tag, never cancelled: a release half made is worse than a slow one. The group
  # must differ from the one the CI workflow sets for itself, which, called from here, would be
  # "Release-push-<the tag's ref>"; two equal groups would wait on each other forever.
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it needs and nothing more.
permissions: {}

jobs:
  check-tag:
    # Runs before the tests, so a mistyped tag fails in seconds instead of after the test jobs.
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch, so the check below can see whether main contains the tagged commit.
          fetch-depth: 0
      - name: Check that the tag is a version on main that equals the project's version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        # The version in pyproject.toml is the one source of the package's version: the wheel,
        # the sdist, and deephaven_massive.__version__ all take it from there. The tag must
        # spell it exactly, with a leading v, so the tag, the files, and the release agree.
        # A version is X.Y.Z, optionally followed by aN, bN or rcN for an alpha, beta or
        # release candidate, which is released as a GitHub pre-release. The runner's own
        # Python reads the file: it needs only the standard library.
        run: |
          set -euo pipefail
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag: $TAG; pyproject.toml version: $version"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::the version in pyproject.toml, '$version', is not X.Y.Z, X.Y.ZaN, X.Y.ZbN or X.Y.ZrcN"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag '$TAG' does not equal 'v$version', the version in pyproject.toml at the tagged commit"
            exit 1
          fi
          # A release is made only from reviewed, merged work.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag names $GITHUB_SHA, which is not on main: merge the version change first, then tag the merged commit"
            exit 1
          fi
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          echo "pre-release: $prerelease"
          printf 'version=%s\nprerelease=%s\n' "$version" "$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    # The same workflow every pull request and push to main runs: lint, every test job
    # (Python 3.11 to 3.14, the free-threaded 3.14t with the GIL off, and the lowest declared
    # dependency versions), and the build, which checks the wheel in a clean environment and
    # keeps the wheel and the sdist as the run's "dist" artifact. A tag push is not a pull
    # request, so every job runs. If any fails, nothing below runs.
    name: CI
    needs: check-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  github-release:
    name: create the GitHub Release
    needs: [check-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creating a release and uploading its files.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and every tag, to find the previous release and the pull
          # requests merged since.
          fetch-depth: 0
      - name: Download the wheel and the sdist the CI build checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check that the distributions are exactly this version's wheel and sdist
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' "deephaven_massive-$VERSION-py3-none-any.whl" "deephaven_massive-$VERSION.tar.gz" | sort)
          actual=$(find dist -mindepth 1 -printf '%f\n' | sort)
          echo "distributions: $(paste -sd ' ' - <<< "$actual")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected exactly $(paste -sd ' ' - <<< "$expected") in the build's artifact"
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Only git-cliff is installed below; there are no project dependencies to cache.
          enable-cache: false
      - name: Write the release notes from the pull request titles
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check-tag.outputs.prerelease }}
        # git-cliff, configured by .github/cliff.toml, lists the commits since the previous
        # release under the headings of their Conventional Commits types. Every pull request
        # is squash-merged, so each commit is one pull request, titled as it was merged, with
        # its number. A pre-release lists what changed since the previous tag of any kind, so
        # rc2's notes show what rc1 lacked; a final release lists everything since the
        # previous final release, its own candidates included. The first release lists the
        # whole history. Only final versions count as releases inside git-cliff, so the
        # candidates between two final releases do not split the notes into sections.
        run: |
          set -euo pipefail
          # The tag must resolve, so the only way git describe below can fail is that no
          # earlier tag matches.
          git rev-parse --verify --quiet "$TAG^{commit}" > /dev/null
          if [ "$PRERELEASE" = true ]; then
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          else
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*[a-z]*' "$TAG^" 2>/dev/null || true)
          fi
          range=()
          if [ -n "$previous" ]; then
            echo "notes cover $previous..$TAG"
            range=("$previous..$TAG")
          else
            echo "no earlier release: notes cover the whole history up to $TAG"
          fi
          uvx git-cliff@2.14.2 --config .github/cliff.toml \
            --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+$' --tag "$TAG" \
            --output "$RUNNER_TEMP/notes.md" -- "${range[@]}"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the release with both distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check-tag.outputs.prerelease }}
        # A pre-release is marked as one, so GitHub never shows it as the latest release.
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  pypi:
    # Off until the owner turns it on. The job runs only when the repository variable
    # PUBLISH_TO_PYPI is exactly "true" (Settings, Secrets and variables, Actions, Variables);
    # unset, or any other value, skips it. Publishing also needs a trusted publisher for this
    # repository, this workflow file, and the environment below, configured on PyPI: with
    # trusted publishing, PyPI accepts a short-lived token that GitHub signs for this job, so
    # no PyPI token is stored anywhere. It runs last because a version published to PyPI can
    # never be uploaded again: a failure anywhere earlier publishes nothing.
    name: publish to PyPI
    needs: [check-tag, github-release]
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      # An environment can require an approval before the job starts, under Settings,
      # Environments, pypi.
      name: pypi
      url: https://pypi.org/project/deephaven-massive/${{ needs.check-tag.outputs.version }}/
    permissions:
      # The token GitHub signs for trusted publishing; nothing else.
      id-token: write
    steps:
      - name: Download the wheel and the sdist the CI build checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
