version: 2
# Dependabot's pull request titles must pass the title check, which allows only the project's
# own types: the prefix below makes them `chore(deps): bump ...` instead of `build(deps): ...`.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
