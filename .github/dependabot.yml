version: 2
# Dependabot's pull request titles must pass the title check, which allows only the project's
# own types: the prefix below makes them `chore(deps): ...` instead of `build(deps): ...`.
# Whether the word after the prefix is "Bump" or "bump" is not a setting: Dependabot infers it
# from recent commits on `main`, so the title check accepts either for Dependabot alone.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
