# Git hooks. Install both stages once per clone:
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# The commit stage runs the fast check tier; the push stage runs the full tier, which runs the
# tests only when the push changes a file CI's tests read (scripts/check_scope.py). pre-commit
# tells the script what is being pushed: on a branch the remote already has, the files changed
# since its remote tip; on a new branch, the whole branch against origin/main.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: check-fast
        name: scripts/check.sh fast --no-fix
        entry: scripts/check.sh fast --no-fix
        language: system
        pass_filenames: false
        always_run: true
      - id: check-full
        name: scripts/check.sh full --no-fix
        entry: scripts/check.sh full --no-fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # The description draft at the worktree root, when there is one, meets the approval
      # rules before the push; the Conventional PR workflow checks the published description.
      - id: check-pr-body
        name: scripts/check_pr_body.py
        entry: uv run python scripts/check_pr_body.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
